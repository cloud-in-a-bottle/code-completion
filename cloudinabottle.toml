[app]
name = "code-completion"
version = "1.1.0"
description = "Code completion server with model management UI and OpenAI-compatible API"

[runtime.container]
image = "Dockerfile"
# Cloud in a Bottle pulls this signed prebuilt image (built from the release tag's commit by CI) instead of building
# `image`. If you fork this app and change it, comment this line out so your instance builds `image` instead.
prebuilt_image = "registry.cloudinabottle.org/code-completion"
port = 8080

[routing]
health_check = "/health"
# The inference endpoints bypass OpenHost owner auth so editors/tools can reach
# them directly. They are instead gated by an app-generated API token (shown in
# the app UI). The management UI stays owner-gated by the router.
public_paths = ["/v1", "/infill", "/completions", "/tokenize", "/detokenize", "/embedding"]

[resources]
memory_mb = 4096
cpu_cores = 4.0

[data]
# Small persistent state (which model is active). Backed up.
app_data = true
# Downloaded GGUF model weights live here: local scratch, recreatable on
# demand and excluded from backups so they don't bloat backup size.
app_temp_data = true
